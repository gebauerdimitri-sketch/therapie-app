<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Schemaarbeit im Therapieverlauf: pseudonyme Klientenprofile, Schema-Bild, Gedanken und Affekt, Konsequenzen.">
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#edf1ef">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111716">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="Therapie">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Therapie">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
</head>
<body>
<title>Therapie – Praxis Gebauer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#edf1ef; --surface:#ffffff; --surface-2:#f5f8f7; --line:#d5dedb;
  --ink:#1b2a29; --ink-2:#4d5e5b; --ink-3:#778784;
  --accent:#2d5f5a; --accent-ink:#ffffff; --accent-soft:#dbe9e6;
  --brand:#17393a;
  --c-skn:#a83c57; --c-skp:#2f7d4f; --c-bkn:#43539f; --c-bkp:#1f8a70;
  --c-norm:#97650f; --c-regel:#7e4494;
  --bub-self-bg:#fdf4f6; --bub-rel-bg:#f3f5fd;
  --ok-bg:#e3f0e6; --ok-ink:#23583a; --warn-bg:#fbefd6; --warn-ink:#7a4d00;
  --crit-bg:#fadcdc; --crit-ink:#9b1c1c; --crit:#c62828;
  --ink-paper:#1b2a29;
  --radius:14px;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#111716; --surface:#19211f; --surface-2:#1f2826; --line:#2f3b39;
    --ink:#e5eeec; --ink-2:#aebdba; --ink-3:#83938f;
    --accent:#7fb8b0; --accent-ink:#0f1a18; --accent-soft:#233532; --brand:#cfe3df;
    --c-skn:#e98aa0; --c-skp:#7fc99b; --c-bkn:#9aa8ef; --c-bkp:#5fc0a8;
    --c-norm:#e0b45c; --c-regel:#cf9be0;
    --bub-self-bg:#271a1f; --bub-rel-bg:#1b1f2e;
    --ok-bg:#1d3326; --ok-ink:#9fd6b0; --warn-bg:#3a2e12; --warn-ink:#f0c46a;
    --crit-bg:#431c1c; --crit-ink:#ff9b9b; --crit:#ef5350;
    --ink-paper:#e5eeec;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111716; --surface:#19211f; --surface-2:#1f2826; --line:#2f3b39;
  --ink:#e5eeec; --ink-2:#aebdba; --ink-3:#83938f;
  --accent:#7fb8b0; --accent-ink:#0f1a18; --accent-soft:#233532; --brand:#cfe3df;
  --c-skn:#e98aa0; --c-skp:#7fc99b; --c-bkn:#9aa8ef; --c-bkp:#5fc0a8;
  --c-norm:#e0b45c; --c-regel:#cf9be0;
  --bub-self-bg:#271a1f; --bub-rel-bg:#1b1f2e;
  --ok-bg:#1d3326; --ok-ink:#9fd6b0; --warn-bg:#3a2e12; --warn-ink:#f0c46a;
  --crit-bg:#431c1c; --crit-ink:#ff9b9b; --crit:#ef5350;
  --ink-paper:#e5eeec;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;
  padding-inline:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.5rem .9rem;min-height:44px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.small{min-height:36px;padding:.25rem .65rem;font-size:.88rem;border-radius:9px}
.btn.danger{color:var(--crit-ink)}
.btn:disabled{opacity:.45;cursor:default}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem .75rem;min-height:44px;width:100%}
textarea.field{min-height:92px;resize:vertical;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st-hyp{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st-best{background:var(--accent-soft);color:var(--accent)}
.st-arb{background:var(--warn-bg);color:var(--warn-ink)}
.st-ver{background:var(--ok-bg);color:var(--ok-ink)}
.cat-chip{border-radius:7px;padding:1px 8px;font-family:var(--mono);font-size:.8rem;font-weight:500;
  border:1.5px solid currentColor;white-space:nowrap}
.c-skn{color:var(--c-skn)} .c-skp{color:var(--c-skp)} .c-bkn{color:var(--c-bkn)}
.c-bkp{color:var(--c-bkp)} .c-norm{color:var(--c-norm)} .c-regel{color:var(--c-regel)}

/* ---------- Rahmen ---------- */
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.2rem;letter-spacing:.02em;color:var(--brand)}
.logo{width:40px;height:40px;color:var(--brand);flex:none}
.brand .app{color:var(--ink-3);font-weight:400;font-size:1rem;border-left:1px solid var(--line);padding-left:12px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:8px;padding:.4rem .85rem;min-height:40px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column}
.side-head{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;text-transform:uppercase;font-family:var(--mono)}
.clist{list-style:none;margin:0;padding:6px;max-height:68vh;overflow:auto}
.clist button{width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.clist button:hover{background:var(--surface-2)}
.clist button[aria-current="true"]{background:var(--accent-soft)}
.clist .code{font-family:var(--mono);font-weight:500;font-size:1.02rem}
.clist .sub{font-size:.8rem;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:26px;color:var(--ink-2)}
.detail{padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.detail-head h2{font-family:var(--mono);font-weight:500;font-size:1.75rem;letter-spacing:.05em}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:.5rem .8rem;min-height:42px;color:var(--ink-2);
  border-bottom:3px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0}
.subtabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:11px;padding:9px 13px;font-size:.88rem}

/* ---------- Schema-Bild ---------- */
.bild{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:1000px){.bild{grid-template-columns:1fr}}

/* Zwei gleich aufgebaute Zeilen; die Figur haengt am Zeilenuebergang,
   damit der Kopf unabhaengig von der Textmenge immer zwischen den Blasen steht. */
.scene{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 10px;align-items:start}
.bubbles{display:contents}
.figure{grid-column:1;grid-row:1;align-self:end;transform:translateY(80%);
  width:104px;color:var(--ink-paper);pointer-events:none}
.figure svg{width:100%;height:auto;display:block}
.brow{display:flex;align-items:center;gap:8px;min-width:0}
.brow.up{grid-column:2;grid-row:1}
.brow.down{grid-column:2;grid-row:2}
.dots{display:flex;flex:none}
.dots i{display:block;border:2.2px solid var(--bub-line,var(--ink-paper));border-radius:50%;
  background:var(--surface);margin-block:3px}
.dots i:nth-child(1){width:6px;height:6px}
.dots i:nth-child(2){width:9px;height:9px;margin-left:6px}
.dots i:nth-child(3){width:13px;height:13px;margin-left:13px}
.brow.up .dots{flex-direction:column-reverse;align-self:flex-end;padding-bottom:4px}
.brow.down .dots{flex-direction:column;align-self:flex-start;padding-top:4px}
.brow.up{--bub-line:var(--c-skn)}
.brow.down{--bub-line:var(--c-bkn)}
.cloud{position:relative;flex:1 1 auto;min-width:0;min-height:190px;display:flex;
  align-items:center;justify-content:center;padding:58px 80px}
.cloud svg{position:absolute;inset:0;width:100%;height:100%}
.cloud .fill{fill:var(--bub-bg);stroke:var(--bub-line);stroke-width:2.2;stroke-linejoin:round}
.cloud[data-bub="self"]{--bub-line:var(--c-skn);--bub-bg:var(--bub-self-bg)}
.cloud[data-bub="rel"]{--bub-line:var(--c-bkn);--bub-bg:var(--bub-rel-bg)}
.cloud-inner{position:relative;display:flex;flex-direction:column;gap:11px;width:100%;max-width:330px}
.cloud-cap{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  text-align:center;color:var(--bub-line);margin-bottom:1px}
.thought{display:flex;flex-direction:column;gap:3px;color:var(--bub-line)}
.thought .lab{font-family:var(--mono);font-size:.82rem;font-weight:500;letter-spacing:.08em;padding-left:2px}
.thought .box{border:2px solid currentColor;border-radius:5px;background:var(--surface);padding:7px 11px;
  width:100%;text-align:left;font-size:.99rem;line-height:1.35;min-height:46px;color:var(--ink);
  display:flex;flex-direction:column;gap:4px;transition:box-shadow .12s}
button.box:hover{box-shadow:0 2px 0 0 var(--bub-line)}
.thought .box em{font-style:normal;color:var(--ink-3);font-size:.9rem}
.thought .box .more{font-size:.86rem;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:4px}
@media (max-width:900px){
  .cloud{padding:52px 58px;min-height:178px}
  .cloud-inner{max-width:100%}
}
/* Hochkant am Telefon: alles untereinander, Gedankenpunkte quer */
@media (max-width:620px){
  .scene{grid-template-columns:1fr}
  .figure{grid-column:1;grid-row:1;justify-self:center;align-self:center;transform:none;width:82px}
  .brow.up{grid-column:1;grid-row:2}
  .brow.down{grid-column:1;grid-row:3}
  .brow{flex-direction:column;align-items:center;gap:2px}
  .brow.up .dots,.brow.down .dots{flex-direction:row;align-self:center;align-items:flex-end;padding:0}
  .dots i{margin-block:0;margin-left:0!important;margin-inline:2px}
  .cloud{padding:44px 34px;min-height:168px;width:100%}
  .cloud-cap{font-size:.64rem}
}
/* Gedanken & Affekt */
.gaflow{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);gap:0 10px;align-items:start;margin-top:2px}
.arrow-in{grid-column:3;grid-row:1;color:var(--ink-paper);width:74px;justify-self:start;margin-left:8%}
.arrow-in svg,.arrow-left svg{width:100%;height:auto;display:block}
.arrow-left{grid-column:2;grid-row:2;color:var(--ink-paper);align-self:start;margin-top:26px}
.ga{display:flex;flex-direction:column;gap:7px}
.ga.ged{grid-column:1;grid-row:2;color:var(--accent)}
.ga.aff{grid-column:3;grid-row:2;color:var(--c-norm)}
.ga h4{font-family:var(--mono);font-size:.92rem;letter-spacing:.12em;text-transform:uppercase;
  border-bottom:2px solid currentColor;padding-bottom:3px;align-self:flex-start}
.ga ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ga li{display:flex;gap:8px;align-items:baseline;font-size:.97rem;color:var(--ink);line-height:1.35}
.ga li::before{content:"\2013";color:currentColor;flex:none}
.ga li .x{margin-left:auto;opacity:0;flex:none;min-height:26px;padding:0 6px}
.ga li:hover .x,.ga li:focus-within .x{opacity:1}
.ga form{display:flex;gap:6px;margin-top:5px;max-width:340px}
.ga form input{min-height:38px;padding:.25rem .6rem;font-size:.92rem}
.ga form button{min-height:38px}
@media (max-width:900px){
  .gaflow{grid-template-columns:1fr;gap:6px}
  .arrow-in{grid-column:1;grid-row:1;justify-self:center;margin:0;width:56px}
  .ga.aff{grid-column:1;grid-row:2}
  .arrow-left{grid-column:1;grid-row:3;margin:12px 0;justify-self:center;transform:rotate(-90deg);width:66px}
  .ga.ged{grid-column:1;grid-row:4}
  .ga li .x{opacity:1}
}
.side-boxes{display:flex;flex-direction:column;gap:26px;padding-top:8px}
.sbox .cap{display:inline-block;border:2px solid var(--ink-paper);border-radius:3px;padding:1px 12px;
  font-family:var(--mono);font-size:.9rem;letter-spacing:.08em;margin-bottom:8px}
.sbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sbox li{font-size:.95rem;display:flex;gap:7px;align-items:baseline}
.sbox li::before{content:"\2013";color:var(--ink-3);flex:none}
.sbox .stem{font-size:.88rem;color:var(--ink-3);margin-bottom:6px;font-style:italic}
.bild-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}

/* ---------- Schemata ---------- */
.catgrid{display:flex;flex-direction:column;gap:20px}
.catsec{display:flex;flex-direction:column;gap:9px}
.catsec > header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding-bottom:5px;border-bottom:2px solid currentColor}
.catsec > header h3{font-size:1.05rem;color:var(--ink);display:flex;align-items:center;gap:9px}
.catsec > header .stem{font-size:.86rem;color:var(--ink-3);font-style:italic}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.card.lead{border-color:currentColor;box-shadow:inset 3px 0 0 currentColor}
.card .txt{font-size:1.05rem;color:var(--ink);line-height:1.35}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--ink-3)}
.card .ev{font-size:.9rem;color:var(--ink-2);border-left:2px solid var(--line);padding-left:10px}
.card .alt{font-size:.95rem;color:var(--c-skp);border-left:2px solid var(--c-skp);padding-left:10px}
.card .acts{display:flex;gap:4px;flex-wrap:wrap}
.hist{font-size:.86rem;color:var(--ink-2)}
.hist summary{cursor:pointer;color:var(--ink-3)}
.hist ol{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.cons-list{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.cons{display:flex;gap:9px;align-items:baseline;font-size:.95rem;padding:5px 0;border-top:1px dashed var(--line)}
.cons .k{font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);flex:none;width:118px;font-weight:700}
@media (max-width:620px){.cons{flex-direction:column;gap:2px}.cons .k{width:auto}}
.cons .del{margin-left:auto;flex:none}

/* ---------- Motive ---------- */
.motive{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.mot{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:7px}
.mot .nm{font-weight:700}
.mot .ds{font-size:.85rem;color:var(--ink-3)}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-width:38px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.picker{display:flex;gap:8px;flex-wrap:wrap}
.pick{border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;background:var(--surface);min-height:40px}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}

/* ---------- Bibliothek ---------- */
.lib{display:flex;flex-direction:column;gap:14px;padding:18px 20px 26px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.libcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.libcard h3{font-size:1.1rem}
.libcard .grp{display:flex;flex-direction:column;gap:4px}
.libcard .grp .eyebrow{color:var(--ink-3)}
.libcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.libcard li{display:flex;gap:8px;align-items:flex-start}
.libcard li .t{flex:1}
.ratings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;font-size:.86rem}
.ratings div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0}
.ratings b{font-family:var(--mono);font-weight:500;color:var(--ink-2)}

/* ---------- Verlauf ---------- */
.log{display:flex;flex-direction:column;gap:2px}
.logday{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.logday{grid-template-columns:1fr;gap:2px}}
.logday .d{font-family:var(--mono);font-size:.85rem;color:var(--ink-3)}
.logday ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.94rem}
.logday li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

/* ---------- Klientenansicht ---------- */
.pres-wrap{max-width:1400px}
.pres{padding:20px 24px 28px}
.pres .bild{grid-template-columns:minmax(0,1fr) 290px;gap:26px}
@media (max-width:1000px){.pres .bild{grid-template-columns:1fr}}
.pres .figure{width:122px}
.pres .cloud{min-height:210px;padding:62px 86px}
.pres .cloud-inner{max-width:390px;gap:14px}
.pres .cloud-cap{font-size:.78rem}
.pres .thought .lab{font-size:.95rem}
.pres .thought .box{font-size:1.18rem;min-height:56px;padding:10px 14px}
.pres .sbox .cap{font-size:1rem}
.pres .sbox li,.pres .sbox .stem{font-size:1.08rem}

      (s.cons||[]).forEach(k=>{
        if(k.kind==="affekt") c.affekt.push({id:k.id, text:k.text, created:k.created});
        else keep.push(k);
      });
      s.cons=keep;
    });
  });
}

function logIt(code,t){
  const c=store.clients[code]; if(!c) return;
  c.log.push({ts:Date.now(), t});
  if(c.log.length>500) c.log=c.log.slice(-500);
}
async function hash(pin){
  const txt="schemaprofil:"+pin;
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ let h=5381; for(const ch of txt) h=(h*33)^ch.charCodeAt(0); return "d"+(h>>>0).toString(16); }
}
function toast(t){
  const el=document.getElementById("toast");
  el.textContent=t; el.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600);
}

function renderPin(){
  const first=!store.pinHash;
  app.innerHTML=`<div class="panel pin-card">
    ${brandHTML(true)}
    <h2>${first?"PIN festlegen":"PIN eingeben"}</h2>
    <p class="muted" style="font-size:.93rem">${first
      ?"Die Profile liegen ausschließlich in diesem Browser. Die PIN schützt sie vor kurzem Blick über die Schulter – sie ersetzt keine Verschlüsselung."
      :"Nur für die Behandlerin oder den Behandler."}</p>
    <form id="pinForm" style="display:flex;flex-direction:column;gap:10px" autocomplete="off">
      <input id="pin1" class="field" type="password" inputmode="numeric" aria-label="PIN" placeholder="••••">
      ${first?`<input id="pin2" class="field" type="password" inputmode="numeric" aria-label="PIN wiederholen" placeholder="wiederholen">`:""}
      <div class="msg" id="pinMsg" role="alert"></div>
      <button class="btn primary" style="justify-content:center">${first?"Speichern und öffnen":"Öffnen"}</button>
    </form></div>`;
  const p1=document.getElementById("pin1"); p1.focus();
  document.getElementById("pinForm").onsubmit=async e=>{
    e.preventDefault();
    const m=document.getElementById("pinMsg");
    if(first){
      const p2=document.getElementById("pin2").value;
      if(!/^\d{4,}$/.test(p1.value)){ m.textContent="Die PIN braucht mindestens 4 Ziffern."; return; }
      if(p1.value!==p2){ m.textContent="Die beiden Eingaben stimmen nicht überein."; return; }
      store.pinHash=await hash(p1.value); save(); toast("PIN gespeichert"); go("main");
    }else{
      if(await hash(p1.value)===store.pinHash) go("main");
      else{ m.textContent="PIN falsch. Bitte erneut versuchen."; p1.value=""; p1.focus(); }
    }
  };
}

function cloudPath(w,h,seed){
  const N=20, base=Math.max(13,Math.min(w,h)*0.085);
  const cx=w/2, cy=h/2;
  const baseRx=Math.max(24,w/2-base), baseRy=Math.max(20,h/2-base);
  const pts=[];
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2-Math.PI/2;
    const j=1+0.045*Math.sin(i*2.3+seed)+0.03*Math.sin(i*1.13+seed*1.9);
    pts.push([cx+baseRx*j*Math.cos(a), cy+baseRy*j*Math.sin(a)]);
  }
  let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<=N;i++){
    const p=pts[i%N], q=pts[i-1];
    const f=0.60+0.09*Math.sin(i*1.7+seed);
    const r=(Math.hypot(p[0]-q[0],p[1]-q[1])*f).toFixed(1);
    d+=` A ${r} ${r} 0 0 1 ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  }
  return d+" Z";
}
function drawCloud(){
  const els=app.querySelectorAll(".cloud");
  if(!els.length) return;
  els.forEach(el=>{
    const svg=el.querySelector("svg");
    const w=Math.round(el.clientWidth), h=Math.round(el.clientHeight);
    if(!svg||!w||!h) return;
    svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
    svg.querySelector("path").setAttribute("d",cloudPath(w,h,parseFloat(el.dataset.seed)||0));
  });
  if(ro){ try{ ro.disconnect(); els.forEach(el=>ro.observe(el)); }catch(e){} }
}

  return `<section class="panel settings">
    <section>
      <h3>Fassung</h3>
      <p>Diese App läuft in der Fassung <span class="num">${esc(BUILD)}</span>. Weicht die Angabe auf zwei Geräten voneinander ab, hat eines davon noch eine ältere Version im Speicher – dann die Seite einmal neu laden.</p>
    </section>
    <section>
      <h3>Wo die Daten liegen</h3>
      <p>Alle Profile liegen ausschließlich im Speicher dieses Browsers auf diesem Gerät. Nichts wird übertragen, nichts liegt auf einem Server. Ein anderer Browser oder ein anderes Gerät zeigt eine leere App.</p>
      <p><strong>Zurzeit gespeichert:</strong> ${n} Profil${n===1?"":"e"}, ${s} Schemata, ${Object.keys(store.clients).reduce((a,c)=>a+consCount(c),0)} Konsequenzen.</p>
    </section>
    <section>
      <h3>Sicherung</h3>
      <p>Der Export legt alle Profile als JSON-Datei ab – als Sicherung und für den Umzug auf ein anderes Gerät.</p>
      <div class="row">
        <button class="btn primary small" data-act="export">Exportieren</button>
        <button class="btn small" data-act="importbtn">Importieren</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </section>
    <section>
      <h3>PIN</h3>
      <p>Die PIN sperrt die Ansicht auf diesem Gerät. Sie verschlüsselt die Daten nicht.</p>
      <div class="row"><button class="btn small" data-act="resetpin">PIN neu setzen</button></div>
    </section>
    <section>
      <h3>Alles löschen</h3>
      <p>Entfernt sämtliche Profile und die PIN aus diesem Browser. Nicht rückgängig zu machen.</p>
      <div class="row"><button class="btn small danger" data-act="wipe">Alle Daten löschen</button></div>
    </section>
  </section>`;
}

/* ================= Modal ================= */
function closeModal(){ modal.innerHTML=""; }
function sheet(html){
  modal.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=modal.querySelector("input,textarea,select"); if(f) f.focus();
}

function schemaEditor(id,cat){
  const s=id?findSchema(selected,id):null;
  const c=s?s.cat:(cat||"sk-");
  sheet(`<h3>${s?"Schema bearbeiten":"Schema anlegen"}</h3>
    <div class="fieldset"><label for="f_cat">Ebene</label>
      <select class="field" id="f_cat">${CATS.map(x=>`<option value="${x.k}" ${x.k===c?"selected":""}>${x.short} – ${x.n}</option>`).join("")}</select>
      <span class="help" id="f_stem">${esc(CAT[c].stem)}</span></div>
    <div class="fieldset"><label for="f_text">Schemasatz</label>
      <textarea class="field" id="f_text" style="min-height:76px" placeholder="In der Sprache des Klienten formulieren">${s?esc(s.text):""}</textarea>
      ${s?`<span class="help">Wird der Satz geändert, bleibt die bisherige Fassung als Verlauf erhalten.</span>`:""}</div>
    <div class="fieldset"><label for="f_status">Status</label>
      <select class="field" id="f_status">${STATUS.map(x=>`<option value="${x.k}" ${s&&s.status===x.k?"selected":""}>${x.n} – ${x.d}</option>`).join("")}</select></div>
    <div class="fieldset"><label for="f_ev">Woran festgemacht</label>
      <textarea class="field" id="f_ev" placeholder="Beobachtung, Aussage, Szene aus der Stunde">${s?esc(s.evidenz):""}</textarea></div>
    <div class="fieldset"><label for="f_alt">Alternative / korrigierte Fassung</label>
      <textarea class="field" id="f_alt" style="min-height:64px" placeholder="Der Satz, der an die Stelle treten soll">${s?esc(s.alt):""}</textarea></div>
    <div class="spread">
      <button class="btn ghost" data-act="close">Abbrechen</button>
      <button class="btn primary" data-act="saveschema" data-v="${s?s.id:""}">Speichern</button>
    </div>`);
  const sel=modal.querySelector("#f_cat");
  sel.onchange=()=>{ modal.querySelector("#f_stem").textContent=CAT[sel.value].stem; };
}

function consEditor(sid){
  const s=findSchema(selected,sid); if(!s) return;
  const C=CAT[s.cat];
  sheet(`<h3>Konsequenz ableiten</h3>
    <p class="muted" style="font-size:.93rem"><span class="cat-chip ${C.cls}">${C.short}</span> ${esc(s.text)}</p>
    <div class="fieldset"><label for="k_kind">Art der Konsequenz</label>
      <select class="field" id="k_kind">${KONS.map(k=>`<option value="${k.k}">${k.n}</option>`).join("")}</select>
      <span class="help" id="k_help">${esc(KONS[0].d)}</span></div>
    <div class="fieldset"><label for="k_text">Konsequenz</label>
      <textarea class="field" id="k_text" placeholder="Konkret und beobachtbar formulieren"></textarea></div>
    <div class="spread">
      <button class="btn ghost" data-act="close">Abbrechen</button>
      <button class="btn primary" data-act="savecons" data-v="${sid}">Hinzufügen</button>
    </div>`);
  const sel=modal.querySelector("#k_kind");
  sel.onchange=()=>{ modal.querySelector("#k_help").textContent=(KO[sel.value]||{d:""}).d; };
}

function leadPicker(cat){
  const C=CAT[cat], list=schemasOf(selected,cat);
  if(!list.length){ schemaEditor(null,cat); return; }
  sheet(`<h3>${C.short} im Bild</h3>
    <p class="muted" style="font-size:.93rem">Welche Sätze sollen in der Gedankenblase stehen?</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${list.map(s=>`<label class="card" style="flex-direction:row;align-items:flex-start;gap:10px;cursor:pointer">
        <input type="checkbox" class="leadbox" value="${s.id}" ${s.lead?"checked":""} style="width:20px;height:20px;margin-top:3px;accent-color:var(--accent)">
        <span><span style="font-size:1rem">${esc(s.text)}</span><br><span class="chip ${(ST[s.status]||ST.hypothese).cls}" style="margin-top:4px">${(ST[s.status]||ST.hypothese).n}</span></span>
      </label>`).join("")}
    </div>
    <div class="spread">
      <button class="btn ghost" data-act="new" data-v="${cat}">Neues ${C.short}-Schema</button>
      <button class="btn primary" data-act="savelead" data-v="${cat}">Übernehmen</button>
    </div>`);
}

function confirmSheet(title,text,act,v){
  sheet(`<h3>${esc(title)}</h3><p class="muted">${esc(text)}</p>
    <div class="spread"><button class="btn ghost" data-act="close">Abbrechen</button>
    <button class="btn danger" data-act="${act}" data-v="${esc(v||"")}">Löschen</button></div>`);
}

/* ================= Aktionen ================= */
function handle(a,v,el){
  const c=selected?store.clients[selected]:null;
  switch(a){
    case "tab": tab=v; renderMain(); break;
    case "sub": sub=v; renderMain(); break;
    case "sel": selected=v; sub="bild"; renderMain(); break;
    case "lock": view="pin"; closeModal(); render(); break;
    case "print": window.print(); break;
    case "showbild": closeModal(); view="show"; render(); window.scrollTo(0,0); break;
    case "endshow": view="main"; render(); window.scrollTo(0,0); break;
    case "fs": toggleFs(); break;
    case "libfilter": libFilter=v; renderMain(); break;

    case "new": closeModal(); schemaEditor(null,v); break;
    case "edit": schemaEditor(v,null); break;
    case "addcons": closeModal(); consEditor(v); break;
    case "pickLead": leadPicker(v); break;
    case "close": closeModal(); break;

    case "saveschema": {
      const cat=modal.querySelector("#f_cat").value;
      const text=modal.querySelector("#f_text").value.trim();
      const status=modal.querySelector("#f_status").value;
      const ev=modal.querySelector("#f_ev").value.trim();
      const alt=modal.querySelector("#f_alt").value.trim();
      if(!text){ toast("Bitte einen Schemasatz eingeben"); return; }
      if(v){
        const s=findSchema(selected,v);
        if(s.text!==text){ s.history.push({ts:s.updated||s.created, text:s.text});
          logIt(selected,`Schema korrigiert: „${s.text}“ → „${text}“`); }
        if(s.status!==status) logIt(selected,`Status geändert: ${CAT[cat].short} „${text}“ → ${ST[status].n}`);
        Object.assign(s,{cat,text,status,evidenz:ev,alt,updated:Date.now()});
      }else{
        c.schemas.push({id:uid(),cat,text,status,lead:["sk-","bk-","sk+","bk+"].includes(cat)&&!schemasOf(selected,cat).some(s=>s.lead),
          evidenz:ev,alt,created:Date.now(),updated:Date.now(),history:[],cons:[]});
        logIt(selected,`Schema ergänzt: „${text}“ (${CAT[cat].short})`);
      }
      save(); closeModal(); renderMain(); toast("Gespeichert"); break;
    }
    case "savecons": {
      const s=findSchema(selected,v);
      const kind=modal.querySelector("#k_kind").value;
      const text=modal.querySelector("#k_text").value.trim();
      if(!text){ toast("Bitte eine Konsequenz eingeben"); return; }
      s.cons.push({id:uid(),kind,text,created:Date.now()});
      logIt(selected,`${KO[kind].n} abgeleitet zu „${s.text}“`);
      save(); closeModal(); renderMain(); toast("Konsequenz hinzugefügt"); break;
    }
    case "savelead": {
      const on=new Set([...modal.querySelectorAll(".leadbox")].filter(x=>x.checked).map(x=>x.value));
      schemasOf(selected,v).forEach(s=>s.lead=on.has(s.id));
      save(); closeModal(); renderMain(); break;
    }
    case "togglelead": {
      const s=findSchema(selected,v); s.lead=!s.lead; save(); renderMain(); break;
    }
    case "delschema": {
      const s=findSchema(selected,v);
      confirmSheet("Schema löschen","„"+s.text+"“ wird mit allen abgeleiteten Konsequenzen entfernt.","delschemaOk",v);
      break;
    }
    case "delschemaOk": {
      const s=findSchema(selected,v);
      c.schemas=c.schemas.filter(x=>x.id!==v);
      logIt(selected,`Schema gelöscht: „${s.text}“`);
      save(); closeModal(); renderMain(); break;
    }
    case "delga": {
      const [kind,id]=v.split("|");
      c[kind]=c[kind].filter(x=>x.id!==id);
      save(); renderMain(); break;
    }
    case "delcons": {
      const [sid,kid]=v.split("|");
      const s=findSchema(selected,sid);
      s.cons=s.cons.filter(k=>k.id!==kid);
      save(); renderMain(); break;
    }
    case "mot": {
      const [k,i]=v.split("|");
      c.motive[k]=(c.motive[k]===+i)?undefined:+i;
      logIt(selected,`Motiv ${MOTIVE.find(m=>m.k===k).n}: ${c.motive[k]===undefined?"zurückgesetzt":c.motive[k]}`);
      save(); renderMain(); break;
    }
    case "stoerung": {
      c.stoerung=v;
      logIt(selected,`Leitendes Muster: ${v?LIBK[v].n:"keines"}`);
      save(); renderMain(); break;
    }
    case "savenote": {
      c.note=document.getElementById("cnote").value.trim();
      save(); renderMain(); toast("Notiz gespeichert"); break;
    }
    case "libadd": {
      if(!selected){ toast("Bitte zuerst links ein Profil wählen"); break; }
      const [lk,i]=v.split("|");
      const item=LIBK[lk].schemas[+i];
      store.clients[selected].schemas.push({id:uid(),cat:item.c,text:item.t,status:"hypothese",
        lead:false,evidenz:"aus der Bibliothek übernommen ("+LIBK[lk].n+")",alt:"",
        created:Date.now(),updated:Date.now(),history:[],cons:[]});
      logIt(selected,`Schema aus Bibliothek übernommen: „${item.t}“ (${CAT[item.c].short})`);
      save(); renderMain(); toast("In "+selected+" übernommen"); break;
    }
    case "delclient":
      confirmSheet("Profil löschen","Alle Schemata, Konsequenzen und der Verlauf von "+selected+" werden entfernt.","delclientOk",selected); break;
    case "delclientOk":
      delete store.clients[v]; selected=null; save(); closeModal(); renderMain(); toast("Profil gelöscht"); break;
    case "export": doExport(); break;
    case "importbtn": document.getElementById("importFile").click(); break;
    case "resetpin": store.pinHash=null; save(); view="pin"; render(); break;
    case "wipe":
      confirmSheet("Alle Daten löschen","Sämtliche Profile und die PIN werden aus diesem Browser entfernt.","wipeOk",""); break;
    case "wipeOk":
      store={clients:{},pinHash:null}; try{localStorage.removeItem(KEY)}catch(e){}
      selected=null; closeModal(); view="pin"; render(); break;
  }
}

app.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  if(t.tagName==="FORM") return;
  e.preventDefault(); handle(t.dataset.act, t.dataset.v, t);
});
app.addEventListener("submit",e=>{
  const g=e.target.closest("[data-act='addga']");
  if(g){
    e.preventDefault();
    const inp=g.querySelector("input"), txt=inp.value.trim(), kind=g.dataset.v;
    if(!txt||!selected) return;
    store.clients[selected][kind].push({id:uid(),text:txt,created:Date.now()});
    logIt(selected,(kind==="gedanken"?"Gedanke":"Affekt")+" ergänzt: „"+txt+"“");
    save(); renderMain();
    const again=document.querySelector(`[data-act='addga'][data-v='${kind}'] input`);
    if(again) again.focus();
    return;
  }
  const f=e.target.closest("[data-act='addclient']"); if(!f) return;
  e.preventDefault();
  const inp=document.getElementById("newCode");
  const code=normCode(inp.value);
  if(!code){ toast("Bitte ein Pseudonym eingeben"); return; }
  if(store.clients[code]){ toast("Pseudonym "+code+" gibt es schon"); return; }
  store.clients[code]=newClient();
  store.clients[code].log.push({ts:Date.now(), t:"Profil angelegt"});
  selected=code; sub="bild"; save(); renderMain(); toast("Profil "+code+" angelegt");
});
app.addEventListener("input",e=>{
  if(e.target.id==="newCode"){ const p=e.target.selectionStart; e.target.value=normCode(e.target.value); e.target.setSelectionRange(p,p); }
});
app.addEventListener("change",e=>{
  if(e.target.id!=="importFile") return;
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data || typeof data.clients!=="object") throw new Error("bad");
      let n=0;
      Object.entries(data.clients).forEach(([k,v])=>{
        let key=k; while(store.clients[key]) key=key+"-2";
        store.clients[key]=v; n++;
      });
      save(); renderMain(); toast(n+" Profil"+(n===1?"":"e")+" importiert");
    }catch(err){ toast("Die Datei ließ sich nicht lesen – erwartet wird ein Export dieser App."); }
  };
  r.readAsText(f);
});
modal.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t){ if(e.target.classList.contains("scrim")) closeModal(); return; }
  e.preventDefault(); handle(t.dataset.act, t.dataset.v, t);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(modal.innerHTML){ closeModal(); return; }
  if(view==="show"&&!document.fullscreenElement){ view="main"; render(); }
});

async function doExport(){
  const data=JSON.stringify(store,null,2);
  const name="therapie-"+new Date().toISOString().slice(0,10)+".json";
  let dl=null;
  try{ dl=await (window.claude&&window.claude.use?window.claude.use("downloads"):null); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name, data}); toast("Export gespeichert"); return; }
    catch(e){ /* abgelehnt oder nicht möglich – Fallback unten */ }
  }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast("Export heruntergeladen"); return;
  }catch(e){}
  sheet(`<h3>Export</h3>
    <p class="muted" style="font-size:.93rem">Der Browser erlaubt hier kein direktes Speichern. Kopieren Sie den Text und legen Sie ihn als <span class="num">${esc(name)}</span> ab.</p>
    <textarea class="field" id="expbox" style="min-height:220px;font-family:var(--mono);font-size:.8rem">${esc(data)}</textarea>
    <div class="spread"><button class="btn ghost" data-act="close">Schließen</button>
    <button class="btn primary" id="copyExp">Kopieren</button></div>`);
  modal.querySelector("#copyExp").onclick=async ()=>{
    const ta=modal.querySelector("#expbox"); ta.select();
    try{ await navigator.clipboard.writeText(data); toast("In die Zwischenablage kopiert"); }
    catch(e){ toast("Bitte mit Strg/Cmd + C kopieren"); }
  };
}

load();
view="pin";
render();
try{ document.fonts && document.fonts.ready.then(drawCloud); }catch(e){}
})();
</script>
